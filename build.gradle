plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.15'
    id 'io.spring.dependency-management' version '1.1.0'
    id "io.freefair.lombok" version "6.6.1"
}

group = 'com.oauth.system'
version = '1.0'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.security.oauth:spring-security-oauth2:2.3.8.RELEASE'
    //implementation 'org.springframework.security:spring-security-oauth2-resource-server:2.3.8.RELEASE'
//    implementation 'org.springframework.security:spring-security-oauth2-client'

    implementation 'org.springframework.security:spring-security-web:5.6.5'  // 버전 다운
    implementation 'org.springframework.security:spring-security-config:5.6.5'  // 버전 다운
    implementation 'org.springframework.security.oauth:spring-security-oauth2:2.3.8.RELEASE'


    implementation 'org.springframework.session:spring-session-jdbc'
    implementation 'mysql:mysql-connector-java:8.0.31'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.1.3'
    testImplementation("org.springframework.boot:spring-boot-starter-test") {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine' // Junit4 호환제거
    }

    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'


    // email 관련 의존성 (springboot starter, aws sdk)
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'software.amazon.awssdk:ses'
    implementation 'software.amazon.awssdk:sns' // We only need to get SNS SDK in our case
    implementation 'software.amazon.awssdk:apache-client'


    // AWS SDK for SQS
    implementation platform('software.amazon.awssdk:bom:2.15.0')
    implementation 'software.amazon.awssdk:sqs'
    implementation 'software.amazon.awssdk:apache-client'

    // Optional: Spring Cloud AWS for easier SQS integration
    implementation 'org.springframework.cloud:spring-cloud-aws-messaging:2.2.1.RELEASE'

    // Optional: Apache HTTP Client
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'

    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.3'
}

