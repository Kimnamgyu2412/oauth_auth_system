<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <meta name="author" content="micehub"/>
  <meta name="description" content="index page"/>
  <script src="https://code.jquery.com/jquery-3.6.2.min.js"
          integrity="sha256-2krYZKh//PcchRtd+H+VyyQoZ/e3EcrkxhM8ycwASPA="
          crossorigin="anonymous"></script>


  <!-- 공통 -->
</head>

<body>

<p th:if="${loginError}" class="error">Wrong securityUser or password</p>

<div class="login-page">
  <div class="login-box">
    <h2>이메일 통합 서비스</h2>
    <form action="/login/process" method="post">
      <div>
        <input type="text" id="username" name="username" autofocus="autofocus" placeholder="아이디">
      </div>
      <div>
        <input type="password" id="password" name="password" placeholder="패스워드">
      </div>
      <div>
        <button type="submit" class="btn">로그인</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
